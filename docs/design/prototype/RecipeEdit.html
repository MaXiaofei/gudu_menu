      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>

    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">写菜谱</span><span style="font-size: 11px; color: #6E5C49; display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #4FAE6E"></span>草稿已自动保存 · 18:02</span></span>

      <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,20,12,0) 55%, rgba(30,20,12,.55))"></span>

      </span>

    <span style="display: flex; gap: 6px">
      <span style="flex: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #F0E6D6; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px">2 人份</span>
      <span style="flex: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #F0E6D6; display: flex; align-items: center; justify-content: center; font-size: 12px">15 分钟</span>
      <span style="flex: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #F0E6D6; display: flex; align-items: center; justify-content: center; font-size: 12px">简单</span>

    </span>

    <div style="background: #FFFFFF; border: 1px solid #F0E6D6; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 10px rgba(169,101,30,.06)">
      <span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">用料 · 3</span><span style="font-size: 12px; color: #B8622A; font-weight: 600">拍菜谱识别</span></span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #FBF0DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/noodle.svg" alt="" width="26" height="26"></span><span style="flex: 1; height: 38px; border-radius: 10px; background: #FDFAF4; border: 1px solid #F0E6D6; display: flex; align-items: center; padding: 0 10px">细面</span><span style="width: 84px; height: 38px; border-radius: 10px; background: #FDFAF4; border: 1px solid #F0E6D6; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box">200 克</span></span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #FBF0DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/sauce.svg" alt="" width="26" height="26"></span><span style="flex: 1; height: 38px; border-radius: 10px; background: #FDFAF4; border: 1px solid #F0E6D6; display: flex; align-items: center; padding: 0 10px">芝麻酱</span><span style="width: 84px; height: 38px; border-radius: 10px; background: #FDFAF4; border: 1px solid #F0E6D6; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box">2 勺</span></span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #FBF0DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/scallion.svg" alt="" width="26" height="26"></span><span style="flex: 1; height: 38px; border-radius: 10px; background: #FDFAF4; border: 1px solid #F0E6D6; display: flex; align-items: center; padding: 0 10px">小葱</span><span style="width: 84px; height: 38px; border-radius: 10px; background: #FDFAF4; border: 1px solid #F0E6D6; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box">1 把</span></span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="width: 36px; height: 36px; border-radius: 10px; border: 1.5px dashed #E8DCCB; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #9C8C7A; flex-shrink: 0">+</span><span style="flex: 1; height: 38px; border-radius: 10px; background: #FFFFFF; border: 2px solid #D17A3C; display: flex; align-items: center; padding: 0 10px; color: #6E5C49; box-sizing: border-box">输入食材…</span></span>

        <span style="padding: 4px 10px 4px 4px; border-radius: 999px; background: #FBF0DD; font-size: 12px; display: flex; align-items: center; gap: 4px"><img src="img/ing/garlic.svg" alt="" width="18" height="18">蒜</span>
        <span style="padding: 4px 10px 4px 4px; border-radius: 999px; background: #FBF0DD; font-size: 12px; display: flex; align-items: center; gap: 4px"><img src="img/ing/cucumber.svg" alt="" width="18" height="18">黄瓜</span>
        <span style="padding: 4px 10px 4px 4px; border-radius: 999px; background: #FBF0DD; font-size: 12px; display: flex; align-items: center; gap: 4px"><img src="img/ing/oil.svg" alt="" width="18" height="18">食用油</span>

      <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px"><input type="radio" name="vis" style="width: 18px; height: 18px; accent-color: #D17A3C; margin: 2px 0 0"><span style="display: flex; flex-direction: column; gap: 2px">同时投稿到公共库<span style="font-size: 12px; color: #6E5C49">审核通过后所有人可见，署名「小王」</span></span></label>
