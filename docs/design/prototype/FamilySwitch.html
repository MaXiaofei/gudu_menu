<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:#B8622A;text-decoration:none}
button,input,textarea{font-family:inherit;color:inherit}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 30px;font-size:15px;font-weight:600;color:#4A382A}
.sb svg{display:block}
.top{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:52px}
.back{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A382A;flex-shrink:0}
.ttl{flex:1;font-size:17px;font-weight:700}
.h1{font-size:24px;font-weight:700}
.card{flex-shrink:0;background:#FFFFFF;border:1px solid #F0E6D6;border-radius:16px;box-shadow:0 2px 10px rgba(169,101,30,.08)}
.sec{font-size:11px;font-weight:700;color:#6E5C49;letter-spacing:1px}
.muted{font-size:12px;color:#6E5C49}
.ing{width:44px;height:44px;border-radius:12px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing img{width:32px;height:32px;display:block}
.av{border-radius:999px;display:block;flex-shrink:0;background:#FBF0DD}
.stack{display:flex}
.stack img{border:2px solid #FFFFFF;border-radius:999px;margin-left:-8px;display:block;background:#FBF0DD}
.stack img:first-child{margin-left:0}
.ph-img{object-fit:cover;display:block;flex-shrink:0;background:#FBF0DD}
.btn{height:52px;border:none;border-radius:14px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(169,101,30,.28);cursor:pointer}
.ghost{height:52px;border-radius:14px;border:1px solid #E8DCCB;background:#FFFFFF;color:#4A382A;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.chip{padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:12px;color:#6E5C49;white-space:nowrap}
.chip.on{background:#4A382A;color:#FFFFFF;border-color:#4A382A;font-weight:700}
.tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:#F0F8EE;color:#2F7347}.tag.warn{background:#FFF7EC;color:#8A5A22;border:1px solid #F6D9BE}.tag.err{background:#DB5A4E;color:#FFFFFF}.tag.info{background:#E8F3FA;color:#2F6A8C}.tag.mute{background:#F5EEE2;color:#6E5C49}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid #F3EBDD}
.seg{display:flex;border-radius:9px;border:1px solid #F0E6D6;overflow:hidden;font-size:12px;background:#FFFFFF;flex-shrink:0}
.seg span{padding:6px 9px;color:#6E5C49}
.seg .ok{background:#4FAE6E;color:#FFFFFF;font-weight:700}.seg .warn{background:#E5A938;color:#4A382A;font-weight:700}.seg .err{background:#DB5A4E;color:#FFFFFF;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;color:#4A382A;font-size:15px}
.lrow+.lrow{border-top:1px solid #F3EBDD}
.lrow .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow .val{margin-left:auto;font-size:13px;color:#6E5C49;display:flex;align-items:center;gap:4px}
.toggle{width:46px;height:28px;border-radius:999px;background:#4FAE6E;position:relative;flex-shrink:0;margin-left:auto}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.off{background:#E8DCCB}.toggle.off::after{right:auto;left:3px}
.dot{width:8px;height:8px;border-radius:999px;background:#DB5A4E;flex-shrink:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #F0E6D6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:22px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:#6E5C49}
.tabbar a[aria-current]{color:#B8622A;font-weight:700}
.tabbar .fab{justify-content:flex-end}
.tabbar .fab span{width:50px;height:50px;margin-top:-24px;border-radius:999px;background:#D17A3C;border:3px solid #FFFFFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(169,101,30,.4)}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
