<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题外观 · 咕嘟小食单原型</title>
<style>
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box}
a{color:var(--title);text-decoration:none}
.phone{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--title);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;border-radius:32px;box-shadow:0 20px 60px rgba(74,56,42,.18);transition:background .25s}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--border);text-align:left;font-family:inherit;color:var(--title);cursor:pointer;width:100%}
.opt[aria-pressed="true"]{border:2px solid var(--primary-deep)}
.radio{width:22px;height:22px;border-radius:999px;border:2px solid var(--border);box-sizing:border-box}
.opt[aria-pressed="true"] .radio{border:7px solid var(--primary-deep)}
.dot{width:22px;height:22px;border-radius:999px;border:1px solid rgba(0,0,0,.06)}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="phone" id="phone">
  <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-size: 15px; font-weight: 600"><span>9:41</span><svg width="62" height="12" viewBox="0 0 62 12" aria-hidden="true"><g fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M28 3.5a8 8 0 0 1 11 0l-1.4 1.5a6 6 0 0 0-8.2 0zM30.6 6.2a4.4 4.4 0 0 1 5.8 0L33.5 9.3z"/><rect x="43" y="1" width="16" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="45" y="3" width="11" height="6" rx="1.5"/><rect x="60" y="4" width="1.6" height="4" rx=".8" opacity=".5"/></g></svg></div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px">
    <a href="Me.html" aria-label="返回" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <span style="flex: 1; font-size: 16px; font-weight: 700">主题外观</span>
  </div>

  <div style="flex: 1; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 16px">
    <span style="font-size: 13px; color: var(--body)">选一个喜欢的配色，全 App 立即生效，下次打开保持</span>

    <div style="border-radius: 22px; background: var(--card); border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.05)">
      <span style="font-size: 11px; font-weight: 700; color: var(--body); letter-spacing: 1px">预览</span>
      <span style="display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--border)">
        <img src="img/dish/huadan-xiaren.jpg" alt="滑蛋虾仁" style="width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 15px; font-weight: 700">滑蛋虾仁</span>
          <span style="display: flex; gap: 6px"><span style="padding: 2px 8px; border-radius: 4px; background: #F0F8EE; color: #2F7347; font-size: 11px; font-weight: 700">家里够 3/3 样</span><span style="padding: 2px 8px; border-radius: 4px; background: var(--primary-soft); color: var(--title); font-size: 11px">10 分钟</span></span>
        </span>
      </span>
      <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><img src="img/dish/qingzheng-luyu.jpg" alt="" style="width: 100%; height: 64px; border-radius: 10px; object-fit: cover"><img src="img/dish/suanrong-xilanhua.jpg" alt="" style="width: 100%; height: 64px; border-radius: 10px; object-fit: cover"><img src="img/dish/lianou-paigu.jpg" alt="" style="width: 100%; height: 64px; border-radius: 10px; object-fit: cover"></span>
      <span style="height: 48px; border-radius: 14px; background: var(--primary-deep); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">现在就做</span>
      <span style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 10px; border-top: 1px solid var(--border); font-size: 10px; text-align: center">
        <span style="color: var(--primary-deep); font-weight: 700">菜谱</span><span style="color: var(--body)">食集</span><span style="color: var(--body)">智荐</span><span style="color: var(--body)">我家余量</span><span style="color: var(--body)">我的</span>
      </span>
    </div>

    <div id="opts" style="display: flex; flex-direction: column; gap: 12px"></div>

    <span style="margin-top: auto; font-size: 12px; color: var(--body); line-height: 1.6">皮肤来自 docs/design/tokens.json，新增一套皮肤后这里自动多一个选项。</span>
  </div>
</div>
<script>
// 色值与 docs/design/tokens.json color.theme 一致（原型内置副本，仅供演示）
var SKINS = {
  cream: { label: '奶油轻食', tagline: '暖橙 + 奶油底，温暖轻盈', primary: '#E89150', primaryDeep: '#D17A3C', primarySoft: '#F6D9BE', secondary: '#FBF0DD', bg: '#FDFAF4', card: '#FFFFFF', border: '#F0E6D6', title: '#4A382A', body: '#6E5C49' },
  matcha: { label: '抹茶禅意', tagline: '草木绿 + 米白，安静克制', primary: '#7A9A5B', primaryDeep: '#648449', primarySoft: '#D8E2C8', secondary: '#E8E4D5', bg: '#F7F5EE', card: '#FFFFFF', border: '#E5E2D5', title: '#2E3520', body: '#68725D' }
};
var VARS = { primary: '--primary', primaryDeep: '--primary-deep', primarySoft: '--primary-soft', secondary: '--secondary', bg: '--bg', card: '--card', border: '--border', title: '--title', body: '--body' };
var phone = document.getElementById('phone');
var opts = document.getElementById('opts');
function apply(key) {
  var s = SKINS[key];
  Object.keys(VARS).forEach(function (k) { phone.style.setProperty(VARS[k], s[k]); });
  Array.prototype.forEach.call(opts.children, function (b) { b.setAttribute('aria-pressed', b.dataset.key === key ? 'true' : 'false'); });
}
Object.keys(SKINS).forEach(function (key) {
  var s = SKINS[key];
  var b = document.createElement('button');
  b.className = 'opt';
  b.dataset.key = key;
  b.innerHTML = '<span style="display:flex;gap:4px">' +
    [s.primary, s.primarySoft, s.bg, s.title].map(function (c) { return '<span class="dot" style="background:' + c + '"></span>'; }).join('') +
    '</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">' + s.label +
    '</span><span style="font-size:12px;color:var(--body)">' + s.tagline + '</span></span><span class="radio"></span>';
  b.onclick = function () { apply(key); };
  opts.appendChild(b);
});
apply('cream');
</script>
</body>
</html>
