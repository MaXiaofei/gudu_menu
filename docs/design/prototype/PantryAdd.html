<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入库 · 咕嘟小食单原型</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:#B8622A;text-decoration:none}
button,input,textarea{font-family:inherit;color:inherit}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 30px;font-size:15px;font-weight:600;color:#4A382A}
.sb svg{display:block}
.top{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:52px}
.back{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A382A;flex-shrink:0}
.ttl{flex:1;font-size:17px;font-weight:700}
.h1{font-size:24px;font-weight:700}
.card{flex-shrink:0;background:#FFFFFF;border:1px solid #F0E6D6;border-radius:16px;box-shadow:0 2px 10px rgba(169,101,30,.08)}
.sec{font-size:11px;font-weight:700;color:#6E5C49;letter-spacing:1px}
.muted{font-size:12px;color:#6E5C49}
.ing{width:44px;height:44px;border-radius:12px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing img{width:32px;height:32px;display:block}
.av{border-radius:999px;display:block;flex-shrink:0;background:#FBF0DD}
.stack{display:flex}
.stack img{border:2px solid #FFFFFF;border-radius:999px;margin-left:-8px;display:block;background:#FBF0DD}
.stack img:first-child{margin-left:0}
.ph-img{object-fit:cover;display:block;flex-shrink:0;background:#FBF0DD}
.btn{height:52px;border:none;border-radius:14px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(169,101,30,.28);cursor:pointer}
.ghost{height:52px;border-radius:14px;border:1px solid #E8DCCB;background:#FFFFFF;color:#4A382A;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.chip{padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:12px;color:#6E5C49;white-space:nowrap}
.chip.on{background:#4A382A;color:#FFFFFF;border-color:#4A382A;font-weight:700}
.tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:#F0F8EE;color:#2F7347}.tag.warn{background:#FFF7EC;color:#8A5A22;border:1px solid #F6D9BE}.tag.err{background:#DB5A4E;color:#FFFFFF}.tag.info{background:#E8F3FA;color:#2F6A8C}.tag.mute{background:#F5EEE2;color:#6E5C49}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid #F3EBDD}
.seg{display:flex;border-radius:9px;border:1px solid #F0E6D6;overflow:hidden;font-size:12px;background:#FFFFFF;flex-shrink:0}
.seg span{padding:6px 9px;color:#6E5C49}
.seg .ok{background:#4FAE6E;color:#FFFFFF;font-weight:700}.seg .warn{background:#E5A938;color:#4A382A;font-weight:700}.seg .err{background:#DB5A4E;color:#FFFFFF;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;color:#4A382A;font-size:15px}
.lrow+.lrow{border-top:1px solid #F3EBDD}
.lrow .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow .val{margin-left:auto;font-size:13px;color:#6E5C49;display:flex;align-items:center;gap:4px}
.toggle{width:46px;height:28px;border-radius:999px;background:#4FAE6E;position:relative;flex-shrink:0;margin-left:auto}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.off{background:#E8DCCB}.toggle.off::after{right:auto;left:3px}
.dot{width:8px;height:8px;border-radius:999px;background:#DB5A4E;flex-shrink:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #F0E6D6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:22px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:#6E5C49}
.tabbar a[aria-current]{color:#B8622A;font-weight:700}
.tabbar .fab{justify-content:flex-end}
.tabbar .fab span{width:50px;height:50px;margin-top:-24px;border-radius:999px;background:#D17A3C;border:3px solid #FFFFFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(169,101,30,.4)}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="ph">
<div class="sb" aria-hidden="true"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="15" height="7" rx="2" fill="currentColor"/><path d="M24.5 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".45"/></svg></span></div>
<div class="top">
  <a href="Pantry.html" class="back" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  <span class="ttl">放进余量</span>
  <button style="height:36px;padding:0 12px;border-radius:999px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍小票
  </button>
</div>
<div style="flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:14px">
  <label style="height:44px;border-radius:12px;background:#FFFFFF;border:1px solid #F0E6D6;display:flex;align-items:center;gap:8px;padding:0 12px;color:#6E5C49">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input placeholder="搜食材，如「五花肉」" aria-label="搜食材" style="flex:1;border:none;outline:none;background:transparent;font-size:14px">
  </label>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span class="sec">你家常买</span>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <span style="position:relative;height:84px;border-radius:14px;border:2px solid #D17A3C;background:#FFF7EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700"><span style="position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:999px;background:#D17A3C;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span><img src="img/ing/egg.svg" alt="" width="36" height="36">鸡蛋</span><span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/tomato.svg" alt="" width="36" height="36">番茄</span><span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/broccoli.svg" alt="" width="36" height="36">西兰花</span><span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/pork.svg" alt="" width="36" height="36">五花肉</span>
      <span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/milk.svg" alt="" width="36" height="36">牛奶</span><span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/scallion.svg" alt="" width="36" height="36">小葱</span><span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/shrimp.svg" alt="" width="36" height="36">虾仁</span><span style="position:relative;height:84px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500"><img src="img/ing/potato.svg" alt="" width="36" height="36">土豆</span>
    </div>
  </div>

  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="ing" style="width:56px;height:56px;border-radius:14px;background:#FBF0DD"><img src="img/ing/egg.svg" alt="" style="width:42px;height:42px"></span>
      <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:18px;font-weight:700">鸡蛋</span><span class="muted">家里还剩 3 个 · 充足</span></span>
    </div>
    <div style="display:flex;gap:10px">
      <span style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="muted">数量</span>
        <span style="height:46px;border-radius:12px;border:1px solid #F0E6D6;display:flex;align-items:center;justify-content:space-between;padding:0 6px">
          <button aria-label="减少" style="width:34px;height:34px;border-radius:10px;border:none;background:#FBF0DD;font-size:18px">−</button>
          <span style="font-size:18px;font-weight:700">10</span>
          <button aria-label="增加" style="width:34px;height:34px;border-radius:10px;border:none;background:#FBF0DD;font-size:18px">+</button>
        </span></span>
      <span style="width:110px;display:flex;flex-direction:column;gap:6px"><span class="muted">单位</span>
        <span style="height:46px;border-radius:12px;border:1px solid #F0E6D6;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:15px">个<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E5C49" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="muted">放在哪</span>
      <span style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:12px;background:#FBF0DD;font-size:14px;text-align:center">
        <span style="height:36px;border-radius:9px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;box-shadow:0 1px 3px rgba(169,101,30,.12)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4FA0D0" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 10h12"/></svg>冷藏</span>
        <span style="height:36px;display:flex;align-items:center;justify-content:center;color:#6E5C49">冷冻</span>
        <span style="height:36px;display:flex;align-items:center;justify-content:center;color:#6E5C49">常温</span>
      </span></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="muted">保质期至</span>
      <span style="height:46px;border-radius:12px;border:1px solid #F0E6D6;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8622A" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span style="flex:1;font-weight:600">2026-11-15</span><span class="tag ok">还有 30 天</span>
        <button aria-label="清空保质期" style="width:26px;height:26px;border:none;border-radius:999px;background:#F5EEE2;color:#6E5C49;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </span>
      <span style="font-size:12px;color:#6E5C49;line-height:1.5">鸡蛋冷藏一般放 30 天，已按今天自动填好，可改，也可清空</span></div>
  </div>
</div>
<div style="padding:12px 16px 30px;background:#FFFFFF;border-top:1px solid #F0E6D6;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6E5C49">本次已加 <span style="display:flex;gap:4px"><span class="ing" style="width:26px;height:26px;border-radius:8px;background:#FBF0DD"><img src="img/ing/tomato.svg" alt="" style="width:20px;height:20px"></span><span class="ing" style="width:26px;height:26px;border-radius:8px;background:#FBF0DD"><img src="img/ing/broccoli.svg" alt="" style="width:20px;height:20px"></span></span>番茄、西兰花<a href="#" style="margin-left:auto;font-weight:600">查看 2</a></div>
  <div style="display:flex;gap:10px"><button class="ghost" style="width:120px">再加一样</button><button class="btn" style="flex:1">放进余量 · 3 样</button></div>
</div>
</div>
</body>
</html>
