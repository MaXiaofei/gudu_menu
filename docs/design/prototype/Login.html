<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 咕嘟小食单原型</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:#B8622A;text-decoration:none}
button,input,textarea{font-family:inherit;color:inherit}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 30px;font-size:15px;font-weight:600;color:#4A382A}
.sb svg{display:block}
.top{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:52px}
.back{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A382A;flex-shrink:0}
.ttl{flex:1;font-size:17px;font-weight:700}
.h1{font-size:24px;font-weight:700}
.card{flex-shrink:0;background:#FFFFFF;border:1px solid #F0E6D6;border-radius:16px;box-shadow:0 2px 10px rgba(169,101,30,.08)}
.sec{font-size:11px;font-weight:700;color:#6E5C49;letter-spacing:1px}
.muted{font-size:12px;color:#6E5C49}
.ing{width:44px;height:44px;border-radius:12px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing img{width:32px;height:32px;display:block}
.av{border-radius:999px;display:block;flex-shrink:0;background:#FBF0DD}
.stack{display:flex}
.stack img{border:2px solid #FFFFFF;border-radius:999px;margin-left:-8px;display:block;background:#FBF0DD}
.stack img:first-child{margin-left:0}
.ph-img{object-fit:cover;display:block;flex-shrink:0;background:#FBF0DD}
.btn{height:52px;border:none;border-radius:14px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(169,101,30,.28);cursor:pointer}
.ghost{height:52px;border-radius:14px;border:1px solid #E8DCCB;background:#FFFFFF;color:#4A382A;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.chip{padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:12px;color:#6E5C49;white-space:nowrap}
.chip.on{background:#4A382A;color:#FFFFFF;border-color:#4A382A;font-weight:700}
.tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:#F0F8EE;color:#2F7347}.tag.warn{background:#FFF7EC;color:#8A5A22;border:1px solid #F6D9BE}.tag.err{background:#DB5A4E;color:#FFFFFF}.tag.info{background:#E8F3FA;color:#2F6A8C}.tag.mute{background:#F5EEE2;color:#6E5C49}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid #F3EBDD}
.seg{display:flex;border-radius:9px;border:1px solid #F0E6D6;overflow:hidden;font-size:12px;background:#FFFFFF;flex-shrink:0}
.seg span{padding:6px 9px;color:#6E5C49}
.seg .ok{background:#4FAE6E;color:#FFFFFF;font-weight:700}.seg .warn{background:#E5A938;color:#4A382A;font-weight:700}.seg .err{background:#DB5A4E;color:#FFFFFF;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;color:#4A382A;font-size:15px}
.lrow+.lrow{border-top:1px solid #F3EBDD}
.lrow .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow .val{margin-left:auto;font-size:13px;color:#6E5C49;display:flex;align-items:center;gap:4px}
.toggle{width:46px;height:28px;border-radius:999px;background:#4FAE6E;position:relative;flex-shrink:0;margin-left:auto}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.off{background:#E8DCCB}.toggle.off::after{right:auto;left:3px}
.dot{width:8px;height:8px;border-radius:999px;background:#DB5A4E;flex-shrink:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #F0E6D6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:22px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:#6E5C49}
.tabbar a[aria-current]{color:#B8622A;font-weight:700}
.tabbar .fab{justify-content:flex-end}
.tabbar .fab span{width:50px;height:50px;margin-top:-24px;border-radius:999px;background:#D17A3C;border:3px solid #FFFFFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(169,101,30,.4)}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="ph" style="background:#FDFAF4">
<div style="position:absolute;inset:0 0 auto 0;height:430px;overflow:hidden">
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 10px;transform:rotate(-6deg) translate(-6px,-34px) scale(1.12)">
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:40px"><img class="ph-img" src="img/dish/hongshao-rou.jpg" alt="" style="width:100%;height:150px;border-radius:18px;box-shadow:0 8px 20px rgba(74,56,42,.18)"><img class="ph-img" src="img/dish/suanrong-xilanhua.jpg" alt="" style="width:100%;height:120px;border-radius:18px;box-shadow:0 8px 20px rgba(74,56,42,.18)"><img class="ph-img" src="img/dish/jiyu-doufu-tang.jpg" alt="" style="width:100%;height:140px;border-radius:18px;box-shadow:0 8px 20px rgba(74,56,42,.18)"></div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:70px"><img class="ph-img" src="img/dish/xihongshi-jidan-tang.jpg" alt="" style="width:100%;height:140px;border-radius:18px;box-shadow:0 8px 20px rgba(74,56,42,.18)"><img class="ph-img" src="img/dish/mapo-doufu.jpg" alt="" style="width:100%;height:120px;border-radius:18px;box-shadow:0 8px 20px rgba(74,56,42,.18)"><img class="ph-img" src="img/dish/nangua-geng.jpg" alt="" style="width:100%;height:150px;border-radius:18px;box-shadow:0 8px 20px rgba(74,56,42,.18)"></div>
  </div>
  <div style="position:absolute;inset:0 0 auto 0;height:110px;background:linear-gradient(180deg,rgba(40,28,20,.45),rgba(40,28,20,0))"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(253,250,244,0) 35%,rgba(253,250,244,.85) 78%,#FDFAF4 100%)"></div>
</div>
<div class="sb" style="position:relative;color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.3)" aria-hidden="true"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="15" height="7" rx="2" fill="currentColor"/><path d="M24.5 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".45"/></svg></span></div>
<div aria-label="微信胶囊按钮（小程序）" style="position:absolute;top:50px;right:12px;width:87px;height:32px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-around;padding:0 10px">
  <svg width="18" height="6" viewBox="0 0 18 6" fill="#4A382A"><circle cx="3" cy="3" r="2.2"/><circle cx="9" cy="3" r="2.6"/><circle cx="15" cy="3" r="2.2"/></svg><span style="width:1px;height:18px;background:rgba(0,0,0,.12)"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A382A" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#4A382A"/></svg>
</div>

<div style="position:relative;margin-top:300px;padding:0 28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
  <img src="img/extra/logo.svg" alt="" width="76" height="76" style="border-radius:22px;box-shadow:0 10px 26px rgba(169,101,30,.35);border:3px solid #FFFFFF">
  <span style="font-size:28px;font-weight:800;letter-spacing:2px;margin-top:6px">咕嘟小食单</span>
  <span style="font-size:15px;color:#6E5C49">家里有什么，今晚就吃什么</span>
</div>

<div style="position:relative;padding:28px 28px 0;display:flex;flex-direction:column;gap:12px">
  <button class="btn" style="background:#07A35A;box-shadow:0 6px 16px rgba(7,163,90,.28)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M9 4C5 4 2 6.7 2 10c0 1.9 1 3.5 2.6 4.6L4 17l2.8-1.4c.7.2 1.4.3 2.2.3h.4A5.6 5.6 0 0 1 9 14c0-3.3 3.1-6 7-6h.6C15.8 5.6 12.7 4 9 4zm-2.5 4a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm5 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/><path d="M22 14c0-2.8-2.7-5-6-5s-6 2.2-6 5 2.7 5 6 5c.6 0 1.2-.1 1.8-.2L20 20l-.5-2a4.8 4.8 0 0 0 2.5-4zm-8-1a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm4 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8z"/></svg>
    微信一键登录</button>
  <button class="ghost">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg>
    手机号验证码登录</button>
  <div style="text-align:center;font-size:13px;padding-top:2px"><a href="#" style="color:#6E5C49">账号密码登录</a></div>
</div>

<div style="position:absolute;left:24px;right:24px;bottom:34px;display:flex;flex-direction:column;gap:10px">
  <div role="alert" style="position:relative;align-self:flex-start;padding:8px 12px;border-radius:10px;background:#4A382A;color:#FFFFFF;font-size:12px;line-height:1.5">请先阅读并勾选下方协议。勾选前不会发起任何登录，也不会读取微信身份。<span style="position:absolute;left:14px;bottom:-5px;width:10px;height:10px;background:#4A382A;transform:rotate(45deg)"></span></div>

  </label>
</div>
</div>
