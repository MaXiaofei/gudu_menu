<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起吃 · 好友点菜 · 咕嘟小食单原型</title>
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 30px;font-size:15px;font-weight:600;letter-spacing:.2px}
.sb i{display:flex;gap:6px;align-items:center;font-style:normal}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.hs>*{flex-shrink:0}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec b{font-size:18px;font-weight:700}
.sec a{font-size:13px;color:#B8622A;font-weight:600}
.lab{font-size:11px;font-weight:700;color:#6E5C49;letter-spacing:1px}
.card{background:#FFFFFF;border:1px solid #F0E6D6;border-radius:16px;box-shadow:0 2px 10px rgba(169,101,30,.08)}
.ph img{display:block}
.cover{object-fit:cover;background:#FBF0DD}
img[src$="qingzheng-luyu.jpg"]{object-position:50% 85%}
img[src$="huadan-xiaren.jpg"]{object-position:50% 80%}
.t15{font-size:15px;font-weight:700}
.t12{font-size:12px;color:#6E5C49}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.ok{background:#F0F8EE;color:#2F7347}.warn{background:#FFF7EC;color:#8A5A22}.err{background:#FDECEA;color:#9A2E22}.info{background:#E8F3FA;color:#2F6A8C}
.plain{background:#FDFAF4;border:1px solid #F0E6D6;color:#6E5C49;font-weight:400}
.ing{width:44px;height:44px;border-radius:12px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing img{width:32px;height:32px}
.av{width:28px;height:28px;border-radius:999px;border:2px solid #FFFFFF;flex-shrink:0;background:#FBF0DD}
.stack{display:flex}.stack>*+*{margin-left:-8px}
.btn{height:52px;padding:0 22px;border:none;border-radius:14px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 12px rgba(169,101,30,.3)}
.btn2{height:52px;padding:0 18px;border-radius:14px;border:1px solid #E8DCCB;background:#FFFFFF;color:#4A382A;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chk{width:24px;height:24px;border-radius:999px;border:2px solid #E8DCCB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#FFFFFF}
.chk.on{background:#4FAE6E;border-color:#4FAE6E}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:4px 16px 0;padding:4px;border-radius:12px;background:#FBF0DD;flex-shrink:0}
.seg a{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6E5C49}
.seg a[aria-selected="true"]{background:#FFFFFF;color:#4A382A;font-weight:700;box-shadow:0 1px 3px rgba(169,101,30,.14)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid #F0E6D6;display:flex;gap:10px;align-items:center}
nav.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid #F0E6D6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:22px}
nav.tab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:#6E5C49}
nav.tab a[aria-current]{font-weight:700;color:#B8622A}
nav.tab a.fab{justify-content:flex-end}
nav.tab .fabi{width:50px;height:50px;margin-top:-24px;border-radius:999px;background:#D17A3C;border:3px solid #FFFFFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(169,101,30,.4)}
.ev{position:relative;height:196px;border-radius:20px;overflow:hidden;color:#FFFFFF;box-shadow:0 8px 22px rgba(74,56,42,.18)}
.ev>img{position:absolute;inset:0;width:100%;height:100%}
.ev .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,26,16,.05) 25%,rgba(40,26,16,.82) 100%)}
.ev .tx{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.chip{padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:13px;color:#6E5C49}
.chip.on{background:#FFF7EC;border-color:#D17A3C;color:#8A5A22;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pk{position:relative;padding:0;overflow:hidden;display:flex;flex-direction:column}
.pk img.cover{width:100%;height:118px}
.pk.on{border:2px solid #D17A3C;box-shadow:0 6px 16px rgba(169,101,30,.2)}
.pk .ck{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.92);border:1.5px solid #E8DCCB;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.pk.on .ck{background:#D17A3C;border-color:#D17A3C}
</style>
<style>body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box}body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="ph">
  <div class="sb" style="color:#4A382A" aria-hidden="true"><span>9:41</span><i>
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#4A382A"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#4A382A" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0M4 7.3a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="#4A382A" stroke="none"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="#4A382A" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.8" fill="#4A382A"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="#4A382A" opacity=".45"/></svg>
  </i></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 12px 8px 16px">
    <span style="font-size:17px;font-weight:700">林林邀你一起点菜</span>
    <div style="width:87px;height:32px;border-radius:16px;border:1px solid #E8DCCB;background:#FFFFFF;display:flex;align-items:center;justify-content:space-around" aria-label="微信胶囊按钮（小程序）">
      <span style="width:18px;height:4px;display:flex;gap:3px"><span style="width:4px;height:4px;border-radius:999px;background:#4A382A"></span><span style="width:4px;height:4px;border-radius:999px;background:#4A382A"></span><span style="width:4px;height:4px;border-radius:999px;background:#4A382A"></span></span>
      <span style="width:1px;height:18px;background:#E8DCCB"></span>
      <span style="width:14px;height:14px;border-radius:999px;border:2px solid #4A382A"></span>
    </div>
  </div>

  <div class="scroll">
  <div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:16px">
    <div class="ev">
      <img class="cover" src="img/dish/tangcu-paigu.jpg" alt=""><span class="sh"></span>
      <span style="position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#4A382A;font-size:12px;font-weight:700">还能点 3 道</span>
      <span class="tx">
        <span style="font-size:22px;font-weight:800">周六 · 爸妈来吃饭</span>
        <span style="font-size:13px;opacity:.92">10 月 19 日 18:00 · 6 人 · 已定 3 道</span>
        <span style="display:flex;align-items:center;gap:8px"><span class="stack"><img class="av" src="img/avatar/linlin.svg" alt="" style="width:28px;height:28px"><img class="av" src="img/avatar/xiaowang.svg" alt="" style="width:28px;height:28px"><img class="av" src="img/avatar/mama.svg" alt="" style="width:28px;height:28px"></span><span style="font-size:12px;opacity:.92">3 人已点</span></span>
      </span>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#E8F3FA;color:#2F6A8C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span style="font-size:13px;line-height:1.6">你只能看到菜名和忌口。对方家里的余量、价格和地址都不会给你看。</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:15px;font-weight:700">你的忌口 <span class="t12" style="font-weight:400">· 只给主人看</span></span>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="chip on">不吃辣</span><span class="chip">海鲜过敏</span><span class="chip">素食</span><span class="chip">+ 其他</span>
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">主人备选的菜</span><span class="t12">点你想吃的</span></span>
      <div class="grid">
      <div class="card pk on" role="checkbox" aria-checked="true">
        <img class="cover" src="img/dish/tangcu-paigu.jpg" alt="糖醋排骨">
        <span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>
        <span style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px"><span class="t15">糖醋排骨</span><span class="t12" style="display:flex;align-items:center;gap:5px;color:#B8622A;font-weight:700"><img class="av" src="img/avatar/xiaowang.svg" alt="" style="width:18px;height:18px">我点的</span></span>
      </div>
      <div class="card pk" role="checkbox" aria-checked="false">
        <img class="cover" src="img/dish/xiaoji-mogu.jpg" alt="小鸡炖蘑菇">
        <span class="ck"></span>
        <span style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px"><span class="t15">小鸡炖蘑菇</span><span class="t12" style="display:flex;align-items:center;gap:5px"><img class="av" src="img/avatar/mama.svg" alt="" style="width:18px;height:18px">妈妈点了</span></span>
      </div>
      <div class="card pk" role="checkbox" aria-checked="false">
        <img class="cover" src="img/dish/youmen-daxia.jpg" alt="油焖大虾">
        <span class="ck"></span>
        <span style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px"><span class="t15">油焖大虾</span><span><span class="tag warn">含海鲜</span></span></span>
      </div>
      <div class="card pk" role="checkbox" aria-checked="false">
        <img class="cover" src="img/dish/suanrong-xilanhua.jpg" alt="蒜蓉西兰花">
        <span class="ck"></span>
        <span style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px"><span class="t15">蒜蓉西兰花</span><span class="t12">还没人点</span></span>
      </div>
      </div>
    </div>
  </div>
  </div>

  <div class="bar">
    <span style="flex:1;font-size:14px;color:#6E5C49">已选 <b style="font-size:20px;color:#4A382A">1</b> 道</span>
    <button class="btn">告诉林林</button>
  </div>
</div>
</body>
</html>
