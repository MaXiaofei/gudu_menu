<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>菜谱详情 · 咕嘟小食单原型</title>
<style>
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:inherit;text-decoration:none}
.phone{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{position:absolute;top:0;left:0;right:0;z-index:2;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:15px;font-weight:600;color:#FFFFFF}
.ib{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#4A382A;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tag{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.ing{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.ing .ic{width:34px;height:34px;border-radius:10px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing .ic img{width:26px;height:26px}
.ing .q{color:#6E5C49;font-size:13px}
.dot{width:7px;height:7px;border-radius:999px;flex-shrink:0}
.steps{display:flex;gap:10px;margin:0 -16px;padding:0 16px}
.step{width:150px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.step img{width:150px;height:100px;border-radius:12px;object-fit:cover;display:block}
.step .n{font-size:11px;font-weight:700;color:#B8622A;letter-spacing:1px}
.step p{margin:0;font-size:13px;line-height:1.5}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><svg width="62" height="12" viewBox="0 0 62 12" aria-hidden="true"><g fill="#FFFFFF"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M28 3.5a8 8 0 0 1 11 0l-1.4 1.5a6 6 0 0 0-8.2 0zM30.6 6.2a4.4 4.4 0 0 1 5.8 0L33.5 9.3z"/><rect x="43" y="1" width="16" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".6"/><rect x="45" y="3" width="11" height="6" rx="1.5"/><rect x="60" y="4" width="1.6" height="4" rx=".8" opacity=".6"/></g></svg></div>

  <div style="height: 262px; position: relative; flex-shrink: 0">
    <img src="img/dish/qingzheng-luyu.jpg" alt="清蒸鲈鱼成品" style="width: 100%; height: 100%; object-fit: cover; object-position: center 45%; display: block">
    <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,20,12,.5) 0%, rgba(30,20,12,0) 34%, rgba(30,20,12,0) 70%, rgba(30,20,12,.35) 100%)"></span>
    <a href="Recipes.html" aria-label="返回" class="ib" style="position: absolute; top: 50px; left: 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <span style="position: absolute; top: 50px; right: 14px; display: flex; gap: 8px">
      <button class="ib" aria-label="分享"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button class="ib" aria-label="收藏"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    </span>
    <span style="position: absolute; right: 14px; bottom: 32px; padding: 4px 10px; border-radius: 999px; background: rgba(30,20,12,.55); color: #FFFFFF; font-size: 11px; font-weight: 600">1 / 6</span>
  </div>

  <div style="flex: 1; overflow: hidden; margin-top: -22px; border-radius: 22px 22px 0 0; background: #FDFAF4; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 14px; position: relative">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 24px; font-weight: 700">清蒸鲈鱼</span>
        <span class="tag" style="background: #FBF0DD; color: #8A5A22">我家的</span>
      </span>
      <span style="display: flex; gap: 14px; font-size: 13px; color: #6E5C49">
        <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>25 分钟</span>
        <span>简单</span><span>4 人份</span><span>做过 4 次</span>
      </span>
      <span style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
        <span class="tag" style="background: #E9F5EC; color: #2F7347">适合高血压</span>
        <span class="tag" style="background: #E9F5EC; color: #2F7347">少油</span>
        <span style="font-size: 12px; color: #6E5C49; display: flex; align-items: center; gap: 4px; margin-left: 2px"><img src="img/avatar/mama.svg" alt="" width="18" height="18" style="border-radius: 999px">改自公共库 · 妈妈调过口味</span>
      </span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #F0E6D6; border-radius: 16px; padding: 12px 14px 8px; box-shadow: 0 2px 10px rgba(169,101,30,.06)">
      <span style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px">
        <span style="font-size: 15px; font-weight: 700">用料</span>
        <span class="tag" style="background: #FFF4E0; color: #8A5A22; font-size: 12px">家里够 4/5 样</span>
      </span>
      <div class="ing"><span class="ic"><img src="img/ing/fish.svg" alt=""></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-weight: 600">鲈鱼</b><span class="q">1 条 · 约 500g</span></span><span class="tag" style="background: #DB5A4E; color: #FFFFFF">明天到期</span></div>
      <div class="ing"><span class="ic"><img src="img/ing/ginger.svg" alt=""></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-weight: 600">姜</b><span class="q">1 块，切丝</span></span><span class="dot" style="background: #4FAE6E"></span><span class="q">家里有</span></div>
      <div class="ing"><span class="ic"><img src="img/ing/sauce.svg" alt=""></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-weight: 600">蒸鱼豉油</b><span class="q">2 勺</span></span><span class="dot" style="background: #4FAE6E"></span><span class="q">家里有</span></div>
      <div class="ing" style="border-top: 1px dashed #F0E6D6; margin-top: 2px; padding-top: 10px"><span class="ic" style="background: #FCE4E1"><img src="img/ing/scallion.svg" alt=""></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-weight: 600">小葱</b><span class="q" style="color: #9A2E22">3 根 · 家里用完了</span></span><button style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid #F6D9BE; background: #FFF4E0; color: #8A5A22; font-size: 12px; font-weight: 700; font-family: inherit">+ 加入采购</button></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">步骤 · 5 步</span><a href="CookMode.html" style="font-size: 12px; color: #B8622A; font-weight: 600">跟做模式 ›</a></span>
      <div class="steps">
        <div class="step"><img src="img/step/qingzheng-luyu-2.jpg" alt="鲈鱼划刀"><span class="n">STEP 1</span><p>鲈鱼洗净，背部斜切厚片，腹部相连。</p></div>
        <div class="step"><img src="img/step/qingzheng-luyu-5.jpg" alt="铺上姜丝"><span class="n">STEP 2</span><p>摆成扇形，铺姜丝葱白腌 10 分钟。</p></div>
        <div class="step"><img src="img/step/qingzheng-luyu-6.jpg" alt="上锅蒸"><span class="n">STEP 3</span><p>水开上锅，大火蒸 8 分钟。</p></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: rgba(255,255,255,.97); border-top: 1px solid #F0E6D6; display: flex; gap: 10px">
    <a href="MenuDetail.html" style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #E8DCCB; background: #FFFFFF; color: #4A382A; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>加入食集</a>
    <a href="CookMode.html" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #E8DCCB; background: #FFFFFF; color: #4A382A; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>跟做</a>
    <a href="CookSheet.html" style="flex: 1; height: 52px; border-radius: 14px; background: #D17A3C; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(169,101,30,.32)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>
      现在就做
    </a>
  </div>
</div>
</body>
</html>
