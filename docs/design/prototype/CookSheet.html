<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>做完确认 · 咕嘟小食单原型</title>
<style>
body{margin:0}
a{color:#B8622A;text-decoration:none}a:hover{color:#8A4519}
</style>
<style>body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box}body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FBF0DD; color: #4A382A; font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif">
  <img src="img/dish/qingzheng-luyu.jpg" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 300px; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(30,20,12,.5)"></div>
  <div role="dialog" aria-label="做完确认" style="position: absolute; left: 0; right: 0; bottom: 0; top: 88px; background: #FDFAF4; border-radius: 22px 22px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 16px">
    <span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #E8DCCB"></span>
    <div style="display: flex; gap: 12px; align-items: center">
      <img src="img/dish/qingzheng-luyu.jpg" alt="清蒸鲈鱼" style="width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex-shrink: 0; box-shadow: 0 4px 12px rgba(74,56,42,.18)">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 20px; font-weight: 700">清蒸鲈鱼做好了</span>
        <span style="font-size: 13px; color: #6E5C49">确认用掉了什么，家里的余量会跟着更新</span>
      </span>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex: 1; background: #FFFFFF; border: 1px solid #F0E6D6; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; color: #6E5C49">做了几人份</span>
        <span style="display: flex; align-items: center; justify-content: space-between">
          <button aria-label="减少" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #F0E6D6; background: #FDFAF4; font-size: 18px; color: #4A382A; font-family: inherit">−</button>
          <span style="font-size: 20px; font-weight: 700">4</span>
          <button aria-label="增加" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #F0E6D6; background: #FDFAF4; font-size: 18px; color: #4A382A; font-family: inherit">+</button>
        </span>
      </div>
      <div style="flex: 1.4; background: #FFFFFF; border: 1px solid #F0E6D6; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; color: #6E5C49">谁吃了</span>
        <span style="display: flex; gap: 10px"><span style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #4A382A; font-weight: 700"><span style="position: relative; display: flex"><img src="img/avatar/xiaowang.svg" alt="" width="34" height="34" style="border-radius: 999px; border: 2px solid #D17A3C; box-sizing: border-box; "><span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 999px; background: #D17A3C; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg></span></span>我</span><span style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #4A382A; font-weight: 700"><span style="position: relative; display: flex"><img src="img/avatar/linlin.svg" alt="" width="34" height="34" style="border-radius: 999px; border: 2px solid #D17A3C; box-sizing: border-box; "><span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 999px; background: #D17A3C; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg></span></span>林林</span><span style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #4A382A; font-weight: 700"><span style="position: relative; display: flex"><img src="img/avatar/mama.svg" alt="" width="34" height="34" style="border-radius: 999px; border: 2px solid #D17A3C; box-sizing: border-box; "><span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 999px; background: #D17A3C; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg></span></span>妈妈</span><span style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #9C8C7A; font-weight: 400"><span style="position: relative; display: flex"><img src="img/avatar/duoduo.svg" alt="" width="34" height="34" style="border-radius: 999px; border: 2px solid #F0E6D6; box-sizing: border-box; opacity: .5; filter: grayscale(.6);"></span>朵朵</span></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; font-weight: 700; color: #6E5C49; letter-spacing: 1px">用料去向</span>
      <div style="background: #FFFFFF; border: 1px solid #F0E6D6; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #F0E6D6">
          <span style="width: 38px; height: 38px; border-radius: 10px; background: #FBF0DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/fish.svg" alt="" width="28" height="28"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">鲈鱼</span><span style="font-size: 12px; color: #6E5C49">家里：充足 → 用完</span></span>
          <span style="display: flex; border-radius: 8px; border: 1px solid #F0E6D6; overflow: hidden; font-size: 12px" role="group" aria-label="鲈鱼去向">
            <span style="padding: 7px 8px; background: #DB5A4E; color: #FFFFFF; font-weight: 700">用完</span>
            <span style="padding: 7px 8px; color: #6E5C49">剩一些</span>
            <span style="padding: 7px 8px; color: #6E5C49">没动</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #F0E6D6">
          <span style="width: 38px; height: 38px; border-radius: 10px; background: #FBF0DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/ginger.svg" alt="" width="28" height="28"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">姜</span><span style="font-size: 12px; color: #6E5C49">家里：充足 → 不足</span></span>
          <span style="display: flex; border-radius: 8px; border: 1px solid #F0E6D6; overflow: hidden; font-size: 12px" role="group" aria-label="姜去向">
            <span style="padding: 7px 8px; color: #6E5C49">用完</span>
            <span style="padding: 7px 8px; background: #E5A938; color: #4A382A; font-weight: 700">剩一些</span>
            <span style="padding: 7px 8px; color: #6E5C49">没动</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #F0E6D6">
          <span style="width: 38px; height: 38px; border-radius: 10px; background: #FBF0DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/sauce.svg" alt="" width="28" height="28"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">蒸鱼豉油</span><span style="font-size: 12px; color: #6E5C49">调料默认不扣</span></span>
          <span style="display: flex; border-radius: 8px; border: 1px solid #F0E6D6; overflow: hidden; font-size: 12px" role="group" aria-label="蒸鱼豉油去向">
            <span style="padding: 7px 8px; color: #6E5C49">用完</span>
            <span style="padding: 7px 8px; color: #6E5C49">剩一些</span>
            <span style="padding: 7px 8px; background: #4FAE6E; color: #FFFFFF; font-weight: 700">没动</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
          <span style="width: 38px; height: 38px; border-radius: 10px; background: #FCE4E1; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="img/ing/scallion.svg" alt="" width="28" height="28"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">小葱</span><span style="font-size: 12px; color: #9A2E22">家里没有，已跳过</span></span>
        </div>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #6E5C49">
      拍一张、写一句食记（可选）
      <span style="display: flex; gap: 8px">
      <span style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><img src="img/dish/qingzheng-luyu.jpg" alt="成品照片" style="width: 48px; height: 48px; border-radius: 12px; object-fit: cover; display: block"><span style="position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 999px; background: #4A382A; color: #FFFFFF; font-size: 12px; line-height: 18px; text-align: center">×</span></span>
      <input placeholder="比如：蒸 8 分钟刚好，下次少放点豉油" style="flex: 1; min-width: 0; box-sizing: border-box; height: 48px; border-radius: 12px; border: 1px solid #F0E6D6; background: #FFFFFF; padding: 0 12px; font-size: 14px; font-family: inherit; color: #4A382A">
      </span>
    </label>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button style="height: 52px; border: none; border-radius: 14px; background: #D17A3C; color: #FFFFFF; font-size: 16px; font-weight: 700; font-family: inherit; box-shadow: 0 4px 12px rgba(169,101,30,.3)">记一笔，更新余量</button>
      <span style="text-align: center; font-size: 12px; color: #6E5C49">记错了可以在食记里撤销，余量会一起恢复</span>
    </div>
  </div>
</div>
</body>
</html>
