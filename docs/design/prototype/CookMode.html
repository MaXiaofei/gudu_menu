<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跟做模式 · 咕嘟小食单原型</title>
<style>

*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:#B8622A;text-decoration:none}
button,input,textarea{font-family:inherit;color:inherit}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 30px;font-size:15px;font-weight:600;color:#4A382A}
.sb svg{display:block}
.top{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:52px}
.back{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A382A;flex-shrink:0}
.ttl{flex:1;font-size:17px;font-weight:700}
.h1{font-size:24px;font-weight:700}
.card{flex-shrink:0;background:#FFFFFF;border:1px solid #F0E6D6;border-radius:16px;box-shadow:0 2px 10px rgba(169,101,30,.08)}
.sec{font-size:11px;font-weight:700;color:#6E5C49;letter-spacing:1px}
.muted{font-size:12px;color:#6E5C49}
.ing{width:44px;height:44px;border-radius:12px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing img{width:32px;height:32px;display:block}
.av{border-radius:999px;display:block;flex-shrink:0;background:#FBF0DD}
.stack{display:flex}
.stack img{border:2px solid #FFFFFF;border-radius:999px;margin-left:-8px;display:block;background:#FBF0DD}
.stack img:first-child{margin-left:0}
.ph-img{object-fit:cover;display:block;flex-shrink:0;background:#FBF0DD}
.btn{height:52px;border:none;border-radius:14px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(169,101,30,.28);cursor:pointer}
.ghost{height:52px;border-radius:14px;border:1px solid #E8DCCB;background:#FFFFFF;color:#4A382A;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.chip{padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:12px;color:#6E5C49;white-space:nowrap}
.chip.on{background:#4A382A;color:#FFFFFF;border-color:#4A382A;font-weight:700}
.tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:#F0F8EE;color:#2F7347}.tag.warn{background:#FFF7EC;color:#8A5A22;border:1px solid #F6D9BE}.tag.err{background:#DB5A4E;color:#FFFFFF}.tag.info{background:#E8F3FA;color:#2F6A8C}.tag.mute{background:#F5EEE2;color:#6E5C49}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid #F3EBDD}
.seg{display:flex;border-radius:9px;border:1px solid #F0E6D6;overflow:hidden;font-size:12px;background:#FFFFFF;flex-shrink:0}
.seg span{padding:6px 9px;color:#6E5C49}
.seg .ok{background:#4FAE6E;color:#FFFFFF;font-weight:700}.seg .warn{background:#E5A938;color:#4A382A;font-weight:700}.seg .err{background:#DB5A4E;color:#FFFFFF;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;color:#4A382A;font-size:15px}
.lrow+.lrow{border-top:1px solid #F3EBDD}
.lrow .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow .val{margin-left:auto;font-size:13px;color:#6E5C49;display:flex;align-items:center;gap:4px}


.ph{background:#1C1511!important;color:#FFFFFF!important}
.tb{display:flex;align-items:center;gap:10px;padding:2px 12px 8px;min-height:52px}
.ib{width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex-shrink:0}
.pg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:0 16px}
.pg i{height:4px;border-radius:999px;background:rgba(255,255,255,.16)}
.pg i.d{background:#E89150}.pg i.c{background:linear-gradient(90deg,#E89150 55%,rgba(255,255,255,.16) 55%)}
.awake{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#F6D9BE;background:rgba(232,145,80,.16);padding:5px 10px;border-radius:999px;white-space:nowrap}
.hero{position:relative;margin:12px 16px 0;height:150px;border-radius:20px;overflow:hidden;flex-shrink:0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .n{position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;letter-spacing:1px;background:rgba(28,21,17,.7);padding:5px 10px;border-radius:8px}
.step{margin:14px 16px 0;font-size:22px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.step em{font-style:normal;color:#F6B98A}
.tmb{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 6px;border-radius:999px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(209,122,60,.35)}
.tmb span{width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.nxt{font-size:13px;color:rgba(255,255,255,.75)}
.qa{margin:14px 16px 0;padding:12px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.q{align-self:flex-end;max-width:84%;background:#FBF0DD;color:#4A382A;font-size:14px;padding:8px 12px;border-radius:14px 14px 4px 14px}
.a{display:flex;gap:8px;align-items:flex-start}
.a img{width:28px;height:28px;border-radius:999px;background:#FFFFFF;flex-shrink:0}
.a p{margin:0;font-size:14px;line-height:1.5;color:#FFFFFF;background:rgba(255,255,255,.1);padding:8px 12px;border-radius:4px 14px 14px 14px}
.tms{display:flex;gap:8px}
.tm{flex:1;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.07);min-width:0}
.tm b{font-size:18px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.tm small{font-size:12px;color:rgba(255,255,255,.75);white-space:nowrap}
.tm.hot{background:rgba(229,169,56,.18);box-shadow:inset 0 0 0 1.5px #E5A938}
.tm.hot b{color:#FFD37A}
.ring{width:34px;height:34px;flex-shrink:0}
.foot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 28px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(28,21,17,0),#1C1511 12%)}
.voice{align-self:center;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;color:#FFFFFF}
.wv{display:flex;gap:3px;align-items:center;height:18px}
.wv i{display:block;width:3px;border-radius:2px;background:#E89150;animation:wv 1s ease-in-out infinite alternate}
@keyframes wv{to{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){.wv i{animation:none}}
.nav2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.nav2 a{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700}
.prev{background:rgba(255,255,255,.1);color:#FFFFFF}
.next{background:#D17A3C;color:#FFFFFF;box-shadow:0 6px 16px rgba(209,122,60,.35)}

</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="ph">
<div class="sb" style="color:#FFFFFF" aria-hidden="true"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="15" height="7" rx="2" fill="currentColor"/><path d="M24.5 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".45"/></svg></span></div>

<div class="tb">
  <a href="RecipeDetail.html" class="ib" aria-label="退出跟做"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M6 6l12 12M18 6 6 18"/></svg></a>
  <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:700">麻婆豆腐</div><div style="font-size:12px;color:rgba(255,255,255,.75)">第 5 / 8 步 · 还剩约 7 分钟</div></div>
  <span class="awake"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>屏幕常亮</span>
</div>
<div class="pg" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="5"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="c"></i><i class=""></i><i class=""></i><i class=""></i></div>
<div class="hero"><img src="img/step/mapo-doufu-5.jpg" alt="豆腐块下入红油汤汁中"><span class="n">STEP 5</span></div>
<div class="step">放入豆腐块，用锅铲背轻轻推开，转<em>小火煮 3 分钟</em>，让豆腐吃进味道。</div>
<div style="display:flex;align-items:center;gap:12px;margin:12px 16px 0">
  <span class="tmb" role="button"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>小火煮 3:00</span>
  <span class="nxt">下一步：水淀粉分两次勾芡</span>
</div>
<div class="qa"><div style="font-size:11px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.75)">问咕嘟 · 带着这一步的上下文</div>
  <div class="q">没有郫县豆瓣酱用什么代替？</div>
  <div class="a"><img src="img/extra/logo.svg" alt="咕嘟"><p>用 1 勺辣椒酱 + 半勺黄豆酱代替，盐先别加。妈妈要少盐，出锅前尝一下再补。</p></div>
</div>
<div class="foot">
<div class="tms">
  <div class="tm"><svg class="ring" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="4"/><circle cx="17" cy="17" r="14" fill="none" stroke="#E89150" stroke-width="4" stroke-linecap="round" stroke-dasharray="54.5 88.0" transform="rotate(-90 17 17)"/></svg><div><b>12:40</b><small>米饭 · 进行中</small></div></div>
  <div class="tm hot"><svg class="ring" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="4"/><circle cx="17" cy="17" r="14" fill="none" stroke="#E5A938" stroke-width="4" stroke-linecap="round" stroke-dasharray="80.9 88.0" transform="rotate(-90 17 17)"/></svg><div><b>0:45</b><small>西兰花焯水 · 快到点</small></div></div>
</div>
  <div class="voice" role="status"><span class="wv"><i style="height:6px;animation-delay:0s"></i><i style="height:12px;animation-delay:0.1s"></i><i style="height:18px;animation-delay:0.2s"></i><i style="height:10px;animation-delay:0.3s"></i><i style="height:16px;animation-delay:0.15s"></i><i style="height:8px;animation-delay:0.25s"></i><i style="height:13px;animation-delay:0.05s"></i></span>说「下一步」或问咕嘟</div>

</div>

</div>
