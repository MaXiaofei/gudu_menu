<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7F8"/>
      <stop offset="1" stop-color="#DCE4E7"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D3D7"/>
      <stop offset="1" stop-color="#E9EEF0"/>
    </linearGradient>
    <linearGradient id="side2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#C9D3D7"/>
      <stop offset="1" stop-color="#E9EEF0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#BFD3DB" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#FFF6E0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF6E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EEF1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#CCDADF" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="360" height="500" fill="url(#wall)"/>
  <!-- 透视侧壁 -->
  <path d="M0 0 L34 26 L34 474 L0 500 Z" fill="url(#side)"/>
  <path d="M360 0 L326 26 L326 474 L360 500 Z" fill="url(#side2)"/>
  <path d="M0 0 L360 0 L326 26 L34 26 Z" fill="#E3EAED"/>
  <!-- 顶灯 -->
  <rect x="140" y="6" width="80" height="10" rx="5" fill="#FFF9EC"/>
  <rect width="360" height="300" fill="url(#glow)"/>
  <!-- 背板竖纹 -->
  <g stroke="#D3DCE0" stroke-width="1">
    <path d="M90 26v448M180 26v448M270 26v448" opacity=".5"/>
  </g>
  <!-- 上层玻璃隔板 -->
  <path d="M34 182 L326 182 L360 198 L0 198 Z" fill="url(#glass)"/>
  <rect x="0" y="198" width="360" height="5" fill="#9FB4BC" opacity=".55"/>
  <path d="M0 198 L360 198" stroke="#FFFFFF" stroke-width="1.5" opacity=".9"/>
  <!-- 下层玻璃隔板 -->
  <path d="M34 352 L326 352 L360 368 L0 368 Z" fill="url(#glass)"/>
  <rect x="0" y="368" width="360" height="5" fill="#9FB4BC" opacity=".55"/>
  <path d="M0 368 L360 368" stroke="#FFFFFF" stroke-width="1.5" opacity=".9"/>
  <!-- 果蔬抽屉 -->
  <rect x="14" y="392" width="160" height="96" rx="10" fill="url(#drawer)" stroke="#B9C9CF" stroke-width="2"/>
  <rect x="186" y="392" width="160" height="96" rx="10" fill="url(#drawer)" stroke="#B9C9CF" stroke-width="2"/>
  <rect x="64" y="402" width="60" height="8" rx="4" fill="#AFC2C9"/>
  <rect x="236" y="402" width="60" height="8" rx="4" fill="#AFC2C9"/>
  <!-- 隔板阴影 -->
  <rect x="34" y="203" width="292" height="14" fill="#9FB4BC" opacity=".12"/>
  <rect x="34" y="373" width="292" height="12" fill="#9FB4BC" opacity=".12"/>
</svg>
