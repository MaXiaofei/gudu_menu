<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>意见反馈 · 咕嘟小食单原型</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:#B8622A;text-decoration:none}
button,input,textarea{font-family:inherit;color:inherit}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 30px;font-size:15px;font-weight:600;color:#4A382A}
.sb svg{display:block}
.top{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:52px}
.back{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A382A;flex-shrink:0}
.ttl{flex:1;font-size:17px;font-weight:700}
.h1{font-size:24px;font-weight:700}
.card{flex-shrink:0;background:#FFFFFF;border:1px solid #F0E6D6;border-radius:16px;box-shadow:0 2px 10px rgba(169,101,30,.08)}
.sec{font-size:11px;font-weight:700;color:#6E5C49;letter-spacing:1px}
.muted{font-size:12px;color:#6E5C49}
.ing{width:44px;height:44px;border-radius:12px;background:#FBF0DD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing img{width:32px;height:32px;display:block}
.av{border-radius:999px;display:block;flex-shrink:0;background:#FBF0DD}
.stack{display:flex}
.stack img{border:2px solid #FFFFFF;border-radius:999px;margin-left:-8px;display:block;background:#FBF0DD}
.stack img:first-child{margin-left:0}
.ph-img{object-fit:cover;display:block;flex-shrink:0;background:#FBF0DD}
.btn{height:52px;border:none;border-radius:14px;background:#D17A3C;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(169,101,30,.28);cursor:pointer}
.ghost{height:52px;border-radius:14px;border:1px solid #E8DCCB;background:#FFFFFF;color:#4A382A;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.chip{padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:12px;color:#6E5C49;white-space:nowrap}
.chip.on{background:#4A382A;color:#FFFFFF;border-color:#4A382A;font-weight:700}
.tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:#F0F8EE;color:#2F7347}.tag.warn{background:#FFF7EC;color:#8A5A22;border:1px solid #F6D9BE}.tag.err{background:#DB5A4E;color:#FFFFFF}.tag.info{background:#E8F3FA;color:#2F6A8C}.tag.mute{background:#F5EEE2;color:#6E5C49}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid #F3EBDD}
.seg{display:flex;border-radius:9px;border:1px solid #F0E6D6;overflow:hidden;font-size:12px;background:#FFFFFF;flex-shrink:0}
.seg span{padding:6px 9px;color:#6E5C49}
.seg .ok{background:#4FAE6E;color:#FFFFFF;font-weight:700}.seg .warn{background:#E5A938;color:#4A382A;font-weight:700}.seg .err{background:#DB5A4E;color:#FFFFFF;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;color:#4A382A;font-size:15px}
.lrow+.lrow{border-top:1px solid #F3EBDD}
.lrow .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow .val{margin-left:auto;font-size:13px;color:#6E5C49;display:flex;align-items:center;gap:4px}
.toggle{width:46px;height:28px;border-radius:999px;background:#4FAE6E;position:relative;flex-shrink:0;margin-left:auto}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.off{background:#E8DCCB}.toggle.off::after{right:auto;left:3px}
.dot{width:8px;height:8px;border-radius:999px;background:#DB5A4E;flex-shrink:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #F0E6D6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:22px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:#6E5C49}
.tabbar a[aria-current]{color:#B8622A;font-weight:700}
.tabbar .fab{justify-content:flex-end}
.tabbar .fab span{width:50px;height:50px;margin-top:-24px;border-radius:999px;background:#D17A3C;border:3px solid #FFFFFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(169,101,30,.4)}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="ph">
<div class="sb" aria-hidden="true"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="15" height="7" rx="2" fill="currentColor"/><path d="M24.5 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".45"/></svg></span></div>
<div class="top">
  <a href="Me.html" class="back" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  <span class="ttl">意见反馈</span>
  <a href="#" style="font-size:13px;font-weight:600;padding:0 6px">我的反馈 2</a>
</div>
<div style="flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;flex-direction:column;gap:8px"><span class="sec">是关于什么的</span>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <span style="height:74px;border-radius:14px;border:2px solid #D17A3C;background:#FFF7EC;color:#4A382A;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8622A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg>出错了</span>
      <span style="height:74px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;color:#6E5C49;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9C8C7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>想要功能</span>
      <span style="height:74px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;color:#6E5C49;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9C8C7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9l5 5M14 9l-5 5"/></svg>菜谱有误</span>
      <span style="height:74px;border-radius:14px;border:1px solid #F0E6D6;background:#FFFFFF;color:#6E5C49;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9C8C7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>其他</span>
    </div></div>
  <label style="display:flex;flex-direction:column;gap:8px"><span class="sec">说说看</span>
    <span class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:none">
      <span style="font-size:15px;line-height:1.65;min-height:76px">采购清单勾选买到的东西以后，点「放进余量」没反应，要退出重进才行。</span>
      <span style="align-self:flex-end;font-size:12px;color:#6E5C49">36 / 500</span>
    </span></label>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="sec">截图（最多 3 张）</span>
    <div style="display:flex;gap:10px">
      <span style="position:relative;width:96px;height:120px;border-radius:12px;overflow:hidden;border:1px solid #F0E6D6;box-shadow:0 2px 8px rgba(169,101,30,.1)">
        <img src="img/extra/feedback-shot.jpg" alt="截图：采购清单页" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block">
        <button aria-label="删除截图" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:999px;border:none;background:rgba(46,32,22,.6);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </span>
      <button aria-label="添加截图" style="width:96px;height:120px;border-radius:12px;border:1.5px dashed #D9C6A6;background:#FFFFFF;color:#B8622A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>1 / 3</button>
    </div></div>
  <label style="display:flex;flex-direction:column;gap:8px"><span class="sec">联系方式（可选，方便我们回复你）</span>
    <input placeholder="手机号或微信号" style="height:46px;border-radius:12px;border:1px solid #F0E6D6;padding:0 12px;font-size:14px;background:#FFFFFF;outline:none"></label>
  <label style="display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#F5EEE2;font-size:12px;color:#6E5C49;line-height:1.6">
    <input type="checkbox" checked style="width:18px;height:18px;margin:0;accent-color:#D17A3C;flex-shrink:0">
    <span>附带设备型号、App 版本和最近一次报错编号 <b style="font-family:ui-monospace,Menlo,monospace;color:#4A382A">7f3a-91c2</b>，帮我们更快定位</span></label>
</div>
<div style="padding:12px 16px 34px"><button class="btn" style="width:100%">提交</button></div>
</div>
