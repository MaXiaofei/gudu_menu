<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>菜谱 · 咕嘟小食单原型</title>
<style>
body{margin:0;min-height:100vh;background:#EDE5D8;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box}
body>div{box-shadow:0 20px 60px rgba(74,56,42,.18);border-radius:32px}
a{color:inherit;text-decoration:none}
.phone{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#FDFAF4;color:#4A382A;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:15px;font-weight:600}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;line-height:16px;white-space:nowrap}
.tag.ok{background:#E9F5EC;color:#2F7347;font-weight:700}.tag.warn{background:#FFF4E0;color:#8A5A22;font-weight:700}.tag.err{background:#FCE4E1;color:#9A2E22;font-weight:700}
.tag.mute{background:#FDFAF4;border:1px solid #F0E6D6;color:#6E5C49;padding:1px 7px}
.chip{padding:6px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #F0E6D6;font-size:12px;color:#6E5C49;white-space:nowrap}
.chip.on{background:#4A382A;border-color:#4A382A;color:#FFFFFF;font-weight:700}
.row{display:flex;gap:12px;padding:10px;border-radius:16px;background:#FFFFFF;border:1px solid #F0E6D6;box-shadow:0 2px 10px rgba(169,101,30,.06)}
.row img{width:84px;height:84px;border-radius:12px;object-fit:cover;flex-shrink:0;display:block}
.row .t{font-size:15px;font-weight:700}
.row .m{font-size:12px;color:#6E5C49}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:#6E5C49}
</style>
<script>if(location.hash==="#embed")document.documentElement.className="embed"</script>
<style>.embed body{padding:0!important;background:none!important;display:block!important;min-height:0!important}.embed body>div{box-shadow:none!important;border-radius:0!important}</style>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><svg width="62" height="12" viewBox="0 0 62 12" aria-hidden="true"><g fill="#4A382A"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M28 3.5a8 8 0 0 1 11 0l-1.4 1.5a6 6 0 0 0-8.2 0zM30.6 6.2a4.4 4.4 0 0 1 5.8 0L33.5 9.3z"/><rect x="43" y="1" width="16" height="10" rx="3" fill="none" stroke="#4A382A" stroke-width="1.2" opacity=".5"/><rect x="45" y="3" width="11" height="6" rx="1.5"/><rect x="60" y="4" width="1.6" height="4" rx=".8" opacity=".5"/></g></svg></div>

  <div style="padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 24px; font-weight: 700">菜谱</span>
      <a href="FamilySwitch.html" style="display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #FFFFFF; border: 1px solid #F0E6D6; font-size: 13px; font-weight: 600">
        <span style="display: flex"><img src="img/avatar/xiaowang.svg" alt="" width="24" height="24" style="border-radius: 999px; border: 2px solid #FFFFFF"><img src="img/avatar/linlin.svg" alt="" width="24" height="24" style="border-radius: 999px; border: 2px solid #FFFFFF; margin-left: -8px"></span>
        小王家的厨房
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </a>
    </div>
    <label style="height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #F0E6D6; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #6E5C49">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input placeholder="搜菜名、食材，或「清淡一点的汤」" aria-label="搜索菜谱" style="flex: 1; min-width: 0; border: none; background: transparent; font-size: 14px; font-family: inherit; color: #4A382A; outline: none">
    </label>
    <div style="display: flex; gap: 22px; border-bottom: 1px solid #F0E6D6">
      <span style="padding: 6px 0 8px; font-size: 15px; font-weight: 700; border-bottom: 3px solid #D17A3C; margin-bottom: -1px">全部</span>
      <span style="padding: 6px 0 8px; font-size: 15px; color: #6E5C49">我家的 32</span>
      <span style="padding: 6px 0 8px; font-size: 15px; color: #6E5C49">公共库</span>
      <span style="padding: 6px 0 8px; font-size: 15px; color: #6E5C49">收藏</span>
    </div>
    <div style="display: flex; gap: 8px">
      <span class="chip on">家里够的优先</span><span class="chip">最近做过</span><span class="chip">做得最多</span>
      <span class="chip" style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>筛选</span>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 2px 16px 100px; display: flex; flex-direction: column; gap: 10px">
    <a href="RecipeDetail.html" style="position: relative; height: 168px; border-radius: 18px; overflow: hidden; flex-shrink: 0; box-shadow: 0 6px 18px rgba(74,56,42,.14)">
      <img src="img/dish/huadan-xiaren.jpg" alt="滑蛋虾仁" style="width: 100%; height: 100%; object-fit: cover; object-position: center 60%; display: block">
      <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,26,16,0) 30%, rgba(40,26,16,.78) 100%)"></span>
      <span style="position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.94); font-size: 11px; font-weight: 700; color: #2F7347; display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #4FAE6E"></span>家里够 3/3 样 · 现在就能做</span>
      <span style="position: absolute; left: 14px; right: 14px; bottom: 12px; color: #FFFFFF; display: flex; justify-content: space-between; align-items: flex-end">
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 20px; font-weight: 700">滑蛋虾仁</span><span style="font-size: 12px; opacity: .92">10 分钟 · 宝宝可吃 · 做过 12 次</span></span>
        <span style="font-size: 12px; opacity: .92">上次 3 天前 · 妈妈做的</span>
      </span>
    </a>

    <a href="RecipeDetail.html" class="row">
      <img src="img/dish/qingzheng-luyu.jpg" alt="清蒸鲈鱼">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0">
        <span style="display: flex; justify-content: space-between; gap: 8px"><span class="t">清蒸鲈鱼</span><span class="m">做过 4 次</span></span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag warn">家里够 4/5 样 · 缺葱</span><span class="tag mute">25 分钟</span></span>
        <span style="font-size: 12px; color: #9A2E22; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>鲈鱼明天到期，先做它</span>
      </span>
    </a>
    <a href="RecipeDetail.html" class="row">
      <img src="img/dish/lianou-paigu.jpg" alt="莲藕排骨汤">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0">
        <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span class="t">莲藕排骨汤</span><span class="tag" style="background: #E6F1F8; color: #2F6A8C; font-weight: 700; font-size: 10px">公共库</span></span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag warn">家里够 2/4 样</span><span class="tag mute">90 分钟</span><span class="tag mute">适合高血压</span></span>
        <span class="m">1.2k 家在做 · 加入我家后可修改</span>
      </span>
    </a>
    <a href="RecipeDetail.html" class="row">
      <img src="img/dish/hongshao-rou.jpg" alt="红烧肉">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0">
        <span style="display: flex; justify-content: space-between; gap: 8px"><span class="t">红烧肉</span><span class="m">做过 2 次</span></span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag err">家里够 1/5 样</span><span class="tag mute">60 分钟</span></span>
        <span class="m">林林少油 · 建议换瘦一点的五花</span>
      </span>
    </a>
    <a href="RecipeDetail.html" class="row">
      <img src="img/dish/suanrong-xilanhua.jpg" alt="蒜蓉西兰花">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0">
        <span style="display: flex; justify-content: space-between; gap: 8px"><span class="t">蒜蓉西兰花</span><span class="m">做过 9 次</span></span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag ok">家里够 2/2 样</span><span class="tag mute">8 分钟</span></span>
        <span class="m">上次上周六</span>
      </span>
    </a>
  </div>

  <a href="RecipeEdit.html" aria-label="写菜谱" style="position: absolute; right: 16px; bottom: 100px; height: 46px; padding: 0 18px; border-radius: 999px; background: #4A382A; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 20px rgba(74,56,42,.3)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    写菜谱
  </a>

  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,.97); border-top: 1px solid #F0E6D6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 22px; box-sizing: border-box">
    <a href="Recipes.html" aria-current="page" style="font-weight: 700; color: #B8622A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 1 2 2z"/></svg>菜谱</a>
    <a href="Menus.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>食集</a>
    <a href="Smart.html" style="justify-content: flex-end">
      <span style="width: 50px; height: 50px; margin-top: -24px; border-radius: 999px; background: #D17A3C; border: 3px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(169,101,30,.4)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 8c0-1.5 1-2 1-3.5M12 8c0-1.5 1-2 1-3.5M16 8c0-1.5 1-2 1-3.5"/></svg></span>智荐</a>
    <a href="Pantry.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M6 10h12M9 6v1.5M9 13v3"/></svg>我家余量</a>
    <a href="Me.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</a>
  </nav>
</div>
</body>
</html>
