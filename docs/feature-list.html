        // 渲染功能列表
        function renderFeatures() {
            const content = document.getElementById('content');
            const platformFilter = document.querySelector('.platform-filter.active').dataset.platform;
            const statusFilter = document.getElementById('status-filter').value;
            const priorityFilter = document.getElementById('priority-filter').value;

            // 过滤功能
            let filtered = features.filter(f => {
                if (platformFilter !== 'all' && f.platform !== platformFilter) return false;
                if (statusFilter !== 'all' && f.status !== statusFilter) return false;
                if (priorityFilter !== 'all' && f.priority !== priorityFilter) return false;
                return true;
            });

            // 按平台和模块分组
            const grouped = {};
            filtered.forEach(f => {
                if (!grouped[f.platform]) grouped[f.platform] = {};
                const moduleKey = `${f.moduleIcon} ${f.module}`;
                if (!grouped[f.platform][moduleKey]) {
                    grouped[f.platform][moduleKey] = [];
                }
                grouped[f.platform][moduleKey].push(f);
            });

            // 渲染
            let html = '';
            const platformNames = {
                admin: { name: '管理后台', icon: '🖥️', desc: 'Web 管理端 · Vue3 + Element Plus' },
                mini: { name: '微信小程序', icon: '📱', desc: '用户端 · uni-app + Vue3' },
                flutter: { name: 'Flutter APP', icon: '📱', desc: 'iOS/Android 原生端' }
            };

            for (const platform in grouped) {
                const pinfo = platformNames[platform];
                html += `
                    <div class="platform-section">
                        <div class="platform-header">
                            <div class="platform-icon">${pinfo.icon}</div>
                            <div class="platform-title">
                                <h2>${pinfo.name}</h2>
                                <p>${pinfo.desc}</p>
                            </div>
                        </div>
                `;

                for (const moduleName in grouped[platform]) {
                    html += `
                        <div class="module">
                            <div class="module-header">
                                <div class="module-title">${moduleName}</div>
                            </div>
                            <div class="feature-list">
                    `;

                    grouped[platform][moduleName].forEach(f => {
                        const statusText = {
                            done: '已完成',
                            partial: '部分完成',
                            planned: '已规划',
                            notstarted: '未开始'
                        }[f.status];

                        const priorityText = {
                            high: '高',
                            medium: '中',
                            low: '低'
                        }[f.priority];

                        html += `
                            <div class="feature">
                                <div class="feature-status status-${f.status}">${statusText}</div>
                                <div class="feature-content">
                                    <div class="feature-name">${f.name}</div>
                                    <div class="feature-desc">${f.desc}</div>
                                </div>
                                <div class="feature-priority priority-${f.priority}">${priorityText}</div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }

                html += `
                    </div>
                `;
            }

            content.innerHTML = html || '<p style="text-align: center; padding: 40px; color: #6c757d;">没有匹配的功能项</p>';

            // 更新统计
            updateStats(filtered);
        }

        // 更新统计数字
        function updateStats(filtered) {
            const total = filtered.length;
            const done = filtered.filter(f => f.status === 'done').length;
            const partial = filtered.filter(f => f.status === 'partial').length;
            const rate = total > 0 ? Math.round((done + partial * 0.5) / total * 100) : 0;

            document.getElementById('total-count').textContent = total;
            document.getElementById('done-count').textContent = done;
            document.getElementById('partial-count').textContent = partial;
            document.getElementById('completion-rate').textContent = rate + '%';
        }

        // 事件绑定
        document.querySelectorAll('.platform-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.platform-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderFeatures();
            });
        });

        document.getElementById('status-filter').addEventListener('change', renderFeatures);
        document.getElementById('priority-filter').addEventListener('change', renderFeatures);

        // 初始渲染
        renderFeatures();
    </script>
