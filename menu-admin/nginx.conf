server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 入口页每次向服务端协商（etag 未变则 304），保证部署后立即拿到新版哈希资源引用。
    # try_files 回退到 /index.html 是内部重定向，同样会命中此精确匹配。
    # 注意：子 location 里只要写了 add_header，就不再继承上层的 add_header，所以各处单独写。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物：长缓存；缺失时直接 404，
    # 不回退到 index.html（否则旧版按需加载的 .js 被换成 HTML，动态导入报错）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端单页路由：历史模式回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（后端 context-path=/gudu，原样透传）
    location /gudu/ {
        proxy_pass http://menu-api:8080/gudu/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }
}
