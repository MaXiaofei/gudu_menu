# 咕嘟小食单 · 全栈一键部署（HTTPS）
# ============================================================
# 首次部署：
#   1. 替换 nginx/init-letsencrypt.sh 中的域名和邮箱
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. ./nginx/init-letsencrypt.sh   （签发 HTTPS 证书）
# ============================================================
services:
  gudu-mysql:
    image: mysql:8.0
    container_name: gudu-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gudu
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--character-set-client-handshake=FALSE"]
    # 安全加固 S13：数据层端口只绑本机回环，外部访问走 SSH 隧道（ssh -L 3306:127.0.0.1:3306）
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./menu-api/sql:/docker-entrypoint-initdb.d:ro

  gudu-redis:
    image: redis:7
    container_name: gudu-redis-prod
    restart: unless-stopped
    # 安全加固 S13：requirepass 从 .env 读（缺失则 compose 直接报错，拒绝无密码启动）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    ports:
      - "127.0.0.1:6379:6379"

  # PGVector 向量库（菜谱向量语义检索，Spring AI 自动建 vector_store 表）
  gudu-pgvector:
    image: pgvector/pgvector:pg17
    container_name: gudu-pgvector-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: gudu
      POSTGRES_USER: gudu
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-gudu_vec_2026}
    ports:
      - "127.0.0.1:25432:5432"   # 错开 staging 的 15432；S13 只绑本机回环
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  # Ollama：生产本地 embedding（2026-08-24 恢复：方案 B 共享预发实测不通——
  # 生产容器经公网 IP 回环被安全组拦截；本容器 7 周前已部署且 bge-m3 就位，
  # 同 gudu_default 网络容器名直连，内网零损耗）
  gudu-ollama:
    image: ollama/ollama
    container_name: gudu-ollama-prod
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  menu-api:
    build: ./menu-api
    container_name: menu-api-prod
    restart: unless-stopped
    depends_on: [gudu-mysql, gudu-redis, gudu-pgvector, gudu-ollama]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${API_KEY:-}}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GUDU_AI_PROVIDER: ${GUDU_AI_PROVIDER:-deepseek}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PGVECTOR_HOST: gudu-pgvector
      PGVECTOR_PORT: "5432"
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:-gudu_vec_2026}
      OLLAMA_BASE_URL: http://gudu-ollama:11434
      # 微信小程序（.env 注入）
      WX_APPID: ${WX_APPID:-}
      WX_APPSECRET: ${WX_APPSECRET:-}
      WX_TOKEN: ${WX_TOKEN:-}
      # 内容安全（A.6）：生产默认开启微信 msgSecCheck / mediaCheckAsync（.env 可设 false 紧急关闭，退回规则）
      GUDU_CONTENT_SECURITY_WX: ${GUDU_CONTENT_SECURITY_WX:-true}
      # 安全加固（security-hardening）：生产强制开启登录校验，不从 .env 读，防误关
      AUTH_LOGIN_CHECK: "true"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      GUDU_CORS_ALLOWED_ORIGINS: https://imxf.cloud
      GUDU_EXPOSE_ERROR_DETAIL: "false"
      # 生产关闭接口文档（A.2），写死不从 .env 读
      GUDU_API_DOCS_ENABLED: "false"
      # 上传文件短时签名（A.3）：生产强制校验；密钥必填（openssl rand -hex 32），更换密钥会让已下发的图片地址立即失效
      GUDU_UPLOAD_SIGN_ENABLED: "true"
      GUDU_UPLOAD_SIGN_SECRET: ${GUDU_UPLOAD_SIGN_SECRET:?GUDU_UPLOAD_SIGN_SECRET required}
      # 字段级加密（B.3）：健康档案 / 手机号 AES-GCM。密钥必填且不可丢失（丢失 = 数据无法解密）；轮换见 application.yml
      GUDU_FIELD_CRYPTO_KEYS: ${GUDU_FIELD_CRYPTO_KEYS:?GUDU_FIELD_CRYPTO_KEYS required}
      GUDU_FIELD_CRYPTO_ACTIVE: ${GUDU_FIELD_CRYPTO_ACTIVE:-1}
      GUDU_FIELD_CRYPTO_HMAC_KEY: ${GUDU_FIELD_CRYPTO_HMAC_KEY:?GUDU_FIELD_CRYPTO_HMAC_KEY required}
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs

  menu-admin:
    build: ./menu-admin
    container_name: menu-admin-prod
    restart: unless-stopped
    depends_on: [menu-api]
    # 不暴露端口到宿主机，由 front-nginx 统一代理

  front-nginx:
    image: nginx:alpine
    container_name: gudu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./staging-images:/var/www/images:ro
    # 接入 staging 网络，使反代可解析 menu-admin-staging（staging.imxf.cloud）
    networks:
      - default
      - gudu-staging_net
    depends_on:
      - menu-admin

  certbot:
    image: certbot/certbot
    container_name: gudu-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      while :; do
        certbot renew --quiet;
        echo "certbot renew checked at $$(date)";
        sleep 12h;
      done'
    depends_on:
      - front-nginx

volumes:
  mysql-data:
  uploads:
  pgvector-data:
  ollama-data:

networks:
  gudu-staging_net:
    external: true
