server:
  port: 8080
  servlet:
    context-path: /gudu

spring:
  autoconfigure:
    # 排除 PgVector 自动配置（其误用主 MySQL 数据源；vectorStore 由 PgVectorConfig 显式定义）
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  ai:
    ollama:
      # 本地 embedding（bge-m3）。备选云 API：base-url 换硅基流动 + spring.ai.openai.*（OpenAI 兼容）
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3
      # 只用 embedding，禁用 chat 自动配置（chat 走项目自有 AiClientRouter）
      chat:
        enabled: false
    vectorstore:
      pgvector:
        # 容器内 service name gudu-pgvector；本地开发连 127.0.0.1:15432
        host: ${PGVECTOR_HOST:127.0.0.1}
        port: ${PGVECTOR_PORT:5432}
        database: gudu
        username: gudu
        password: ${PGVECTOR_PASSWORD:gudu_vec_2026}
        # 启动自动建 vector_store 表 + 索引
        initialize-schema: true
        dimensions: 1024          # bge-m3 输出维度
        distance-type: COSINE_DISTANCE
        index-type: HNSW

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-share: false
  token-style: uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true

gudu:
  upload-dir: uploads
  # 未知异常是否回显异常类型/根因（仅本地/测试排查用；生产必须 false）
  expose-error-detail: ${GUDU_EXPOSE_ERROR_DETAIL:false}
  cors:
    # 允许跨域的源（逗号分隔，支持通配模式）；生产只放正式域名
    allowed-origins: ${GUDU_CORS_ALLOWED_ORIGINS:*}
  # 内容安全（A.6）：微信 msgSecCheck / mediaCheckAsync。关闭时文本只走规则禁发词、图片不提交（dev/test 默认关，prod 开）
  content-security:
    wx-enabled: ${GUDU_CONTENT_SECURITY_WX:false}
    # 微信服务器拉取图片用的公网前缀，拼上 /gudu/uploads/…；为空则图片无法提交检测（头像会被拒绝保存）
    media-base-url: ${GUDU_MEDIA_BASE_URL:}
    # 违规图片隔离目录（不能在 upload-dir 内）；为空 = 「upload-dir」-quarantine
    quarantine-dir: ${GUDU_QUARANTINE_DIR:}
  ai:
    # AI provider：deepseek（默认，真调 DeepSeek，失败降级 mock）/ glm（智谱 GLM）/ mock（规则表兜底）
    # 启动初值；运行时可经 PUT /ai/provider 热切换（写 Redis，重启不丢）
    provider: ${GUDU_AI_PROVIDER:deepseek}
    # 每 member 每日 AI 调用上限（scene 无关，防滥用；null/无 member 不限）
    daily-limit: ${GUDU_AI_DAILY_LIMIT:50}
    deepseek:
      base-url: https://api.deepseek.com/v1
      model: deepseek-flash
      # 优先 DEEPSEEK_API_KEY，回退老的 API_KEY（兼容已部署机器的 docker-compose.env）
      key: ${DEEPSEEK_API_KEY:${API_KEY:}}
    glm:
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-plus
      key: ${GLM_API_KEY:}        # 从环境变量 GLM_API_KEY 注入，不硬编码

# 微信小程序（appid/secret 由部署环境注入，缺省为空=微信登录不可用）
wx:
  appid: ${WX_APPID:}
  secret: ${WX_APPSECRET:}
  # 公众平台「服务器配置」Token：GET /auth/wx-echo 验证 signature 用，须与后台填的一致
  token: ${WX_TOKEN:}

# token 拦截总开关：默认 true = 强制登录（公共只读接口另有游客白名单，见 SaTokenConfig）。
# false 仅供本地/测试环境放开；生产 compose 强制 true。
auth:
  login-check: ${AUTH_LOGIN_CHECK:true}
