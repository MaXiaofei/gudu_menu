# 生产/容器部署：连 compose 内的 db 容器（service name）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://gudu-mysql:3306/gudu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      host: gudu-redis
      port: 6379
      password: ${REDIS_PASSWORD:}   # 与 compose 中 gudu-redis --requirepass 同源（.env REDIS_PASSWORD）

# 生产关闭接口文档（A.2）；staging/test 也用 prod profile，由 compose 设 GUDU_API_DOCS_ENABLED=true 打开
springdoc:
  api-docs:
    enabled: ${GUDU_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${GUDU_API_DOCS_ENABLED:false}

gudu:
  upload-dir: /app/uploads/prod
  # 上传文件签名校验（A.3）：生产必须开，密钥 GUDU_UPLOAD_SIGN_SECRET 必填（缺失启动失败）
  upload-sign:
    enabled: ${GUDU_UPLOAD_SIGN_ENABLED:true}
  # 生产开启微信内容安全（A.6）；隔离目录默认 /app/uploads/prod-quarantine（同卷、不对外服务）
  content-security:
    wx-enabled: ${GUDU_CONTENT_SECURITY_WX:true}
    media-base-url: ${GUDU_MEDIA_BASE_URL:https://imxf.cloud}
  ai:
    provider: ${GUDU_AI_PROVIDER:deepseek}
    deepseek:
      base-url: https://api.deepseek.com/v1
      model: deepseek-flash
      key: ${DEEPSEEK_API_KEY:${API_KEY:}}   # 兼容：优先 DEEPSEEK_API_KEY，回退 API_KEY
    glm:
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-plus
      key: ${GLM_API_KEY:}

# 日志：同时输出到控制台(docker logs) + 文件(/app/logs/)
logging:
  file:
    path: /app/logs
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
