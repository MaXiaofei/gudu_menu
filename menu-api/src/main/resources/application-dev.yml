spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发连腾讯云测试库（staging 对外端口 13306，与生产 3306 错开）
    url: jdbc:mysql://49.232.3.201:13306/gudu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: GuduHikariCP

  data:
    redis:
      host: 49.232.3.201
      port: 16379
      database: 0
      timeout: 3000ms

gudu:
  # 本地/测试环境：未知异常回显根因便于排查
  expose-error-detail: ${GUDU_EXPOSE_ERROR_DETAIL:true}
  # 字段加密固定测试密钥（B.3，dev / test / staging 共用 gudu 库，三者必须一致；生产另配，见 application.yml）
  # e2e-seed.sql 里的手机号 HMAC 常量由下面的 hmac-key 推导，改密钥须同步（FieldCryptoSeedConsistencyTest 校验）
  field-crypto:
    keys: ${GUDU_FIELD_CRYPTO_KEYS:1:Z3VkdS1kZXYtdGVzdC1maWVsZC1rZXktMDEyMzQ1NiE=}
    hmac-key: ${GUDU_FIELD_CRYPTO_HMAC_KEY:gudu-dev-test-phone-hmac-0123456}
  ai:
    provider: ${GUDU_AI_PROVIDER:deepseek}
    deepseek:
      base-url: https://api.deepseek.com/v1
      model: deepseek-flash
      key: ${DEEPSEEK_API_KEY:${API_KEY:}}   # 兼容：优先 DEEPSEEK_API_KEY，回退 API_KEY
    glm:
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-plus
      key: ${GLM_API_KEY:}

# 本地/测试环境默认不强制登录（用户决定：测试/开发环境保持放开）
auth:
  login-check: ${AUTH_LOGIN_CHECK:false}

# multi-tenant-family：未登录请求的兜底家庭（仅 auth.login-check=false 时生效；默认家庭「咕嘟之家」id=1）
gudu.tenant.anonymous-family-id: ${GUDU_TENANT_ANON_FAMILY:1}
