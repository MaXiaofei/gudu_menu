# ============================================================
# 咕嘟小食单 · CI/CD 部署
#
# 触发条件：
#   - push 到 main 分支    → 部署生产环境 (prod, 端口 80)
#   - push 到 feat/mvp 分支 → 部署测试环境 (staging, 端口 9090)
#
# 流程：
#   1. 检出代码（GitHub 云端）
#   2. Maven 打包 jar（复用依赖缓存，约 3 分钟）
#   3. scp jar + deploy.sh 到服务器 /tmp（源文件须在 workspace 下，scp-action 跑在容器里）
#   4. SSH 执行 deploy.sh（docker cp + restart + 健康检查）
#
# 需要配置的 GitHub Secrets（仓库 Settings → Secrets and variables → Actions）：
#   - SSH_HOST：服务器 IP（如 49.232.3.201）
#   - SSH_USER：SSH 用户名（如 root）
#   - SSH_PASS：SSH 密码
#   - SSH_PORT：SSH 端口（默认 22）
# ============================================================
name: Deploy

on:
  push:
    branches:
      - main       # 生产环境
      - feat/mvp   # 测试环境
  workflow_dispatch: # 允许手动触发

jobs:
  # 判断部署目标环境
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.ENV }}
      should_deploy: ${{ steps.set-env.outputs.SHOULD_DEPLOY }}
    steps:
      - id: set-env
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "SHOULD_DEPLOY=true" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "feat/mvp" ]; then
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "SHOULD_DEPLOY=true" >> $GITHUB_OUTPUT
          else
            echo "ENV=skip" >> $GITHUB_OUTPUT
            echo "SHOULD_DEPLOY=false" >> $GITHUB_OUTPUT
          fi

  # 构建 jar 并部署
  build-and-deploy:
    needs: determine-env
    if: needs.determine-env.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ needs.determine-env.outputs.env }}

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Maven 缓存（加速依赖下载，首次约 5 分钟，后续约 30 秒）
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('menu-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Maven 打包（跳过测试编译和运行，CI 只负责构建产物）
      #    -Dmaven.test.skip=true 跳过测试代码编译（MenuControllerTest 有历史编译错误，待修）
      - name: Build jar
        working-directory: menu-api
        run: mvn -B clean package -Dmaven.test.skip=true

      # 5. 确认 jar 产物 + deploy.sh，统一放到 workspace 内的 deploy-artifacts/
      #    （appleboy/scp-action 跑在 Docker 容器里，只挂载 GITHUB_WORKSPACE，
      #     看不到 runner 的 /tmp，所以源文件必须放在 workspace 下）
      - name: Prepare artifacts
        run: |
          mkdir -p deploy-artifacts
          cp menu-api/target/*.jar deploy-artifacts/menu-api-deploy.jar
          cp scripts/deploy.sh deploy-artifacts/deploy.sh
          ls -lh deploy-artifacts/

      # 6. scp jar + deploy.sh 到服务器 /tmp（一次传两个，strip_components 去掉目录层）
      - name: Upload artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy-artifacts/menu-api-deploy.jar,deploy-artifacts/deploy.sh"
          target: "/tmp"
          strip_components: 1
          overwrite: true

      # 8. SSH 执行部署（jar 已在 /tmp/menu-api-deploy.jar）
      - name: Deploy to ${{ env.DEPLOY_ENV }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_ENV
          script: |
            chmod +x /tmp/deploy.sh
            ENV=$DEPLOY_ENV /tmp/deploy.sh

      # 9. 部署结果通知
      - name: Deploy status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 部署成功: ${{ env.DEPLOY_ENV }} @ $(date)"
          else
            echo "❌ 部署失败: ${{ env.DEPLOY_ENV }} @ $(date)"
            exit 1
          fi
