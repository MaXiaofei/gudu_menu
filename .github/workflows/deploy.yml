# ============================================================
# 咕嘟小食单 · CI/CD 部署
#
# 触发条件：
#   - push 到 main 分支    → 部署生产环境 (prod, 端口 80)
#   - push 到 feat/mvp 分支 → 部署测试环境 (staging, 端口 9090)
#
# 流程（方案 A：服务器自构建，不跨境传 jar）：
#   GitHub runner 只判断环境 + 发起 SSH（单行命令）；
#   服务器 git pull 最新源码（MB 级）→ scripts/deploy.sh 负责
#   docker compose build（多阶段，maven 在容器内）→ 重启 → 健康检查。
#
# 需要配置的 GitHub Secrets（仓库 Settings → Secrets and variables → Actions）：
#   - SSH_HOST：服务器 IP（如 49.232.3.201）
#   - SSH_USER：SSH 用户名（如 root）
#   - SSH_PASS：SSH 密码
#   - SSH_PORT：SSH 端口（默认 22）
# ============================================================
name: Deploy

on:
  push:
    branches:
      - main       # 生产环境
      - feat/mvp   # 测试环境
  workflow_dispatch: # 允许手动触发

jobs:
  # 判断部署目标环境
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.ENV }}
      should_deploy: ${{ steps.set-env.outputs.SHOULD_DEPLOY }}
    steps:
      - id: set-env
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "SHOULD_DEPLOY=true" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "feat/mvp" ]; then
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "SHOULD_DEPLOY=true" >> $GITHUB_OUTPUT
          else
            echo "ENV=skip" >> $GITHUB_OUTPUT
            echo "SHOULD_DEPLOY=false" >> $GITHUB_OUTPUT
          fi

  # SSH 到服务器，让服务器自己 git pull + docker build
  deploy:
    needs: determine-env
    if: needs.determine-env.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ needs.determine-env.outputs.env }}

    steps:
      # SSH 到服务器：cd 部署目录 → git pull → 调 deploy.sh（构建+重启+健康检查）
      # 单行命令调用，避免 ssh-action 多行 script 内容丢失的已知问题
      - name: Deploy to ${{ env.DEPLOY_ENV }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_ENV
          command_timeout: 15m
          script_stop: true
          script: |
            set -e; if [ "$DEPLOY_ENV" = "prod" ]; then D=/root/gudu; else D=/root/gudu-staging; fi; cd "$D" && git fetch --all --prune && git reset --hard "origin/$(git rev-parse --abbrev-ref HEAD)" && ENV="$DEPLOY_ENV" bash scripts/deploy.sh

      # 部署结果通知
      - name: Deploy status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 部署成功: ${{ env.DEPLOY_ENV }} @ $(date)"
          else
            echo "❌ 部署失败: ${{ env.DEPLOY_ENV }} @ $(date)"
            exit 1
          fi
