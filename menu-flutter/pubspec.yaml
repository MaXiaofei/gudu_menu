name: menu_flutter
description: 咕嘟小食单 App（Flutter 版）—— 与 menu-mini 小程序功能/样式一致的 Android+iOS 应用。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    # 用户协议 / 隐私政策（源：仓库根 docs/legal/，修改后需同步拷贝）
    - assets/legal/
    # 原型自绘插画（源 docs/design/prototype/img，scripts/design/gen-assets.mjs 生成）
    - assets/ing/
    - assets/avatar/
    - assets/brand/
